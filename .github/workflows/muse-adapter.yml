name: Muse AI bridge quality gates

on:
  pull_request:
    paths:
      - "src/providers/video/snapgen_muse.py"
      - "scripts/muse_*.py"
      - "tests/test_snapgen_muse.py"
      - "tests/test_muse_render.py"
      - "docs/tv_comparison_8_scenes.json"
      - ".github/workflows/muse-adapter.yml"
  push:
    branches:
      - "feature/snapgen-muse-zero-credit-qa-20261027"

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install only test dependency
        run: python -m pip install --no-input pytest
      - name: Compile Muse bridge scripts
        run: |
          python -m py_compile src/providers/video/snapgen_muse.py
          python -m py_compile scripts/muse_bridge.py scripts/muse_browser.py
          python -m py_compile scripts/muse_voice.py scripts/muse_render_telegram.py
      - name: Run free-only QA regression checks
        run: pytest -q tests/test_snapgen_muse.py tests/test_muse_render.py
