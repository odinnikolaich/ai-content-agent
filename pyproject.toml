[build-system]
requires=["setuptools>=68","wheel"]
build-backend="setuptools.build_meta"
[project]
name="ai-content-agent"
version="0.1.0"
description="Local-first, provider-agnostic AI short-video content pipeline"
readme="README.md"
requires-python=">=3.11"
license={text="MIT"}
dependencies=["PyYAML>=6.0","Pillow>=10.0","imageio-ffmpeg>=0.5.1"]
[project.optional-dependencies]
dev=["pytest>=8.0"]
[tool.pytest.ini_options]
testpaths=["tests"]
pythonpath=["src"]
addopts="-q"
[tool.setuptools.packages.find]
where=["src"]
